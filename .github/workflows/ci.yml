name: CI

on:
  push:
    branches: [main, develop, "feature/**", "pr-*/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        # Format-check intentionally skipped during the legacy refactor —
        # too many auto-format diffs in webhooks.py / bitable.py to land in
        # the same PR. Re-enable once those files are split.
        run: ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest
    env:
      FEISHU_APP_ID: test_app_id
      FEISHU_APP_SECRET: test_app_secret
      FEISHU_VERIFY_TOKEN: test_verify_token
      FEISHU_BITABLE_APP_TOKEN: test_bitable_token
      FEISHU_TASK_TABLE_ID: test_task_table
      FEISHU_PERSON_TABLE_ID: test_person_table
      GITHUB_WEBHOOK_SECRET: test_github_secret
      DEEPSEEK_KEY: test_deepseek_key
      MATCH_MODE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run all tests with coverage gate
        # Gate at 70% as a realistic baseline given the legacy
        # webhooks.py / bitable.py monoliths (omitted in pyproject.toml).
        # Target ratchets up as those files are refactored in subsequent PRs.
        # Includes integration tests so the assign / qa / feishu_im
        # modules (which only have integration coverage) count.
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
        with:
          config-path: .gitleaks.toml

  build:
    needs: [lint, typecheck, test, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: taskbot-mvp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
